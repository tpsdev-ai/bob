name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# The GitHub repository permission is read-only (contents: read): the workflow
# token cannot write to the repository. No job needs write access, and no
# secret is added for one.
permissions:
  contents: read

# Pinning action SHAs follows the same convention as tpsdev-ai/cli and
# tpsdev-ai/flair: prevents a compromised tag from running arbitrary code.
# The trailing full release tag records the version at the pinned SHA.
#
# `sfw bun install` wraps install with Socket Firewall — an ephemeral
# HTTP proxy that blocks known-malicious packages before they're fetched.
# Complements bunfig.toml's minimumReleaseAge: age-gate catches the
# "compromised, not yet detected" window, sfw catches confirmed malware
# regardless of age. Belt + suspenders.

jobs:
  action-pins:
    name: Action Pin Versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check action pin versions
        run: node scripts/check-action-pins.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  build:
    name: Build (TypeScript strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.10"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      - run: sfw bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build

  test:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.10"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      - run: sfw bun install --frozen-lockfile
      - run: bun run build
      # The changelog fragment gate (bob#236): refuses a malformed fragment, and
      # anything but the managed note under [Unreleased]. Read-only, no secret.
      - name: changelog fragments (check)
        run: node scripts/changelog-fragments.mjs check
      # Provision the unprivileged user the jarvis key-read proof runs as (the
      # runner is disposable; that is where useradd belongs).
      - name: provision jarvis-sidecar (reachy key-read proof)
        run: sudo useradd -r -M -s /usr/sbin/nologin jarvis-sidecar
      - run: bun run test

  # The whole-suite leak check (#221) runs in ITS OWN job: it spawns a second,
  # complete suite with a fresh TMPDIR, which would slow the unit job down. The
  # unit suite keeps the leak test OPT-IN (it skips unless BOB_LEAK_CHECK=1), so
  # `bun run test` above stays fast. Same install/build/sidecar-user setup as
  # Unit Tests because the child runs the whole suite.
  leak-check:
    name: Suite Temp-Dir Leak Check
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.10"
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      - run: sfw bun install --frozen-lockfile
      - run: bun run build
      # Provision the unprivileged user the jarvis key-read proof runs as (the
      # runner is disposable; that is where useradd belongs).
      - name: provision jarvis-sidecar (reachy key-read proof)
        run: sudo useradd -r -M -s /usr/sbin/nologin jarvis-sidecar
      # BOB_LEAK_CHECK enables the check in THIS process; BOB_LEAK_CHECK_CHILD=0
      # marks it as the parent (the check's own child sets BOB_LEAK_CHECK_CHILD=1,
      # which makes the child skip this file so it cannot recurse).
      - name: Whole-suite temporary-directory leak check
        run: BOB_LEAK_CHECK=1 BOB_LEAK_CHECK_CHILD=0 bun test test/leak-check.test.ts

  pack:
    name: Published Artifact
    needs: build
    runs-on: ubuntu-latest
    # Every packaging defect this repo has hit — an uninstallable `workspace:`
    # spec, a capability catalog pointing at a path that exists only in a
    # checkout — was green in the monorepo the entire time. The only thing that
    # catches that class is packing a tarball, installing it into a directory
    # with nothing else in it, and running the result. So CI does that on every
    # PR rather than trusting anyone to remember.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.10"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      - run: sfw bun install --frozen-lockfile
      - run: bun run build
      # npm, not bun: npm is what a user runs, what the release pipeline
      # publishes with, and the one that does NOT rewrite specs when it builds a
      # tarball — a bun-only check passes on artifacts npm would break. Under
      # sfw so the tarball's own install still goes through Socket Firewall.
      - name: Pack, install and run the published artifact
        run: sfw node scripts/verify-pack.mjs

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.10"
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      - run: sfw bun install --frozen-lockfile
      - name: Check for known vulnerabilities
        run: bun audit
