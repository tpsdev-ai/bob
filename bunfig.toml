# Bob's bun configuration.
#
# Supply-chain defense via release-age policy:
# bun.com/docs/cli/install#minimum-release-age
#
# 7 days catches the "compromise published, not yet detected" window.
# Newer versions are filtered at install time; the lockfile picks an
# older, stability-verified version automatically.
#
# Excludes: @types/node and typescript are too tied to the runtime
# version we target — we want their newest releases on-demand. They're
# also published by Microsoft + node-types maintainers (lower risk than
# random npm authors) and locked via package.json semver ranges.

[install]
minimumReleaseAge = 604800
# @biomejs/biome was excluded here until 2026-08-26. The exclusion was
# BROKEN as written -- it named only the meta package, while biome ships
# its executables as separate platform packages (@biomejs/cli-darwin-arm64,
# cli-linux-x64-musl, and six more). Excluding the meta package alone was
# unsatisfiable, so any lockfile regeneration produced either a biome with
# no runnable binary or a hard install failure (bob#67).
#
# It was DROPPED rather than widened to nine. No rationale for it was ever
# recorded, and the reasons given below for @types/node and typescript cut
# the other way for biome: it ships precompiled native binaries that execute
# during lint (the highest-risk class to fast-track), it is not coupled to
# our runtime version, and it is published by a smaller org. Nothing breaks
# if a linter is seven days old.
#
# Do not re-add biome -- or anything else -- without a written reason here.
minimumReleaseAgeExcludes = ["@types/node", "typescript"]
